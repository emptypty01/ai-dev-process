openapi: 3.1.0
info:
  title: 商品与多商品订单API
  version: 0.2.0
  description: 创建请求由单商品改为items；摘要改为商品种数/总件数。前后端须同版本发布。历史订单数据保留，金额响应改为字符串。
servers:
- url: http://localhost:8081
- url: http://localhost:8082
- url: http://localhost:8083
paths:
  /api/health:
    get:
      summary: 进程存活检查，不代表数据库就绪
      responses:
        '200':
          description: 服务正常
  /api/products:
    get:
      summary: 商品目录，按ID倒序
      parameters:
      - in: query
        name: enabled
        schema:
          type: boolean
      responses:
        '200':
          description: 商品列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: 新增商品，默认启用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProduct'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': &id001
          description: 输入无效、商品不可用或订单金额越界；响应含message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/products/{id}:
    put:
      summary: 编辑商品，仅影响新订单
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProduct'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': *id001
        '404': &id002
          description: 记录不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/products/{id}/status:
    put:
      summary: 启用或停用商品，保留历史订单
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductStatus'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': *id001
        '404': *id002
  /api/orders:
    get:
      summary: 最近100笔订单摘要
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
    post:
      summary: 按提交时配置价创建多商品订单，服务端精确计价并保存快照
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '400': *id001
  /api/orders/{id}:
    get:
      summary: 查看订单及下单商品快照，已取消/已停用仍可查看
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404': *id002
  /api/orders/{id}/cancel:
    post:
      summary: NEW转CANCELLED，重复取消保持原结果，保留明细
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummary'
        '404': *id002
components:
  schemas:
    Product:
      type: object
      required:
      - id
      - type
      - name
      - price
      - enabled
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 80
        price: &id003
          type: string
          pattern: ^\d+\.\d{2}$
          description: 人民币十进制字符串，保留两位小数；勿转成浮点数计算
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SaveProduct:
      type: object
      additionalProperties: false
      required:
      - type
      - name
      - price
      properties:
        type:
          type: string
          minLength: 1
          x-normalization: strip
          description: 去除首尾空白后1–40字，自由填写；长度校验作用于归一化后的值
        name:
          type: string
          minLength: 1
          x-normalization: strip
          description: 去除首尾空白后1–80字，不要求名称唯一；长度校验作用于归一化后的值
        price:
          oneOf:
          - type: string
            pattern: ^(?!0+(?:\.0{1,2})?$)\d{1,8}(?:\.\d{1,2})?$
          - type: number
            minimum: 0.01
            maximum: 99999999.99
            multipleOf: 0.01
          description: 0.01–99999999.99，最多两位小数，推荐十进制字符串
    ProductStatus:
      type: object
      additionalProperties: false
      required:
      - enabled
      properties:
        enabled:
          type: boolean
    CreateOrder:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLineInput'
    OrderLineInput:
      type: object
      additionalProperties: false
      required:
      - productId
      - quantity
      properties:
        productId:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
      description: 同商品合并为一条，合并后仍限1–1000；不接收客户端价格/名称
    OrderSummary:
      type: object
      required:
      - id
      - orderNo
      - productCount
      - totalQuantity
      - totalAmount
      - status
      - createdAt
      properties:
        id: &id004
          type: integer
          format: int64
        orderNo: &id005
          type: string
        productCount: &id006
          type: integer
        totalQuantity: &id007
          type: integer
          format: int64
        totalAmount: *id003
        status: &id008
          type: string
          enum:
          - NEW
          - CANCELLED
        createdAt: &id009
          type: string
          format: date-time
    OrderDetail:
      type: object
      required:
      - id
      - orderNo
      - productCount
      - totalQuantity
      - totalAmount
      - status
      - createdAt
      - items
      properties:
        id: *id004
        orderNo: *id005
        productCount: *id006
        totalQuantity: *id007
        totalAmount: *id003
        status: *id008
        createdAt: *id009
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    OrderLine:
      type: object
      required:
      - productId
      - productName
      - productType
      - unitPrice
      - quantity
      - lineTotal
      - source
      properties:
        productId:
          type:
          - integer
          - 'null'
          format: int64
        productName:
          type: string
        productType:
          type:
          - string
          - 'null'
          description: LEGACY未记录类型时为空，界面展示历史商品（未记录类型）
        unitPrice: *id003
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
        lineTotal: *id003
        source:
          type: string
          enum:
          - CATALOG
          - LEGACY
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
